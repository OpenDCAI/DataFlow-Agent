[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataflow-agentmm"
version = "1.0.7"
description = "DataFlow-AgentMM: multimodal agent runtime, contracts, and trajectory operators built on DataFlow-MM."
readme = "README.md"
requires-python = ">=3.10, <4"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "DataFlow-AgentMM contributors"},
]
dependencies = [
    "open-dataflow-mm",
    "pandas",
    "Pillow",
    "jsonschema",
    "openai",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
dataflow-agentmm-trajectory-html = "dataflow_agentmm.visualization.__main__:main"
dataflow-agentmm-export-swift = "dataflow_agentmm.export.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dataflow_agentmm", "dataflow_agentmm.*"]

[tool.setuptools.package-data]
dataflow_agentmm = [
    "skills/*/SKILL.md",
    "skills/*/agents/*.yaml",
    "skills/*/references/*.md",
    "skills/*/scripts/*.py",
    "visualization/README.md",
    "visualization/assets/*.html",
    "visualization/assets/*.css",
    "visualization/assets/*.js",
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataflow-mm-agent"
version = "1.0.0"
description = "Multimodal agent runtime contracts and trajectory operators for DataFlow-MM."
readme = "README.md"
requires-python = ">=3.10, <4"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "DataFlow-MM-Agent contributors"},
]
dependencies = [
    "open-dataflow-mm",
    "pandas",
    "Pillow",
    "jsonschema",
    "openai",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
dataflow-mm-trajectory-html = "dataflow_mm_agent.visualization.__main__:main"
dataflow-mm-export-swift = "dataflow_mm_agent.export.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dataflow_mm_agent", "dataflow_mm_agent.*"]

[tool.setuptools.package-data]
dataflow_mm_agent = [
    "skills/*/SKILL.md",
    "skills/*/agents/*.yaml",
    "skills/*/references/*.md",
    "skills/*/scripts/*.py",
    "visualization/README.md",
    "visualization/assets/*.html",
    "visualization/assets/*.css",
    "visualization/assets/*.js",
]
